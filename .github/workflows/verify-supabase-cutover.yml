name: Verify migrated Supabase access

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/verify-supabase-cutover.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SUPABASE_URL: https://cwxadcrtnbciziexbili.supabase.co
      SUPABASE_KEY: ${{ secrets.SUPABASE_SECRET_KEY || secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - name: Verify Supabase credential against migrated project
        run: |
          set -euo pipefail
          test -n "$SUPABASE_KEY" || { echo 'No Supabase production secret is configured.'; exit 1; }
          auth=(-H "apikey: $SUPABASE_KEY")
          if [[ "$SUPABASE_KEY" != sb_secret_* ]]; then
            auth+=(-H "Authorization: Bearer $SUPABASE_KEY")
          fi
          curl --fail --silent --show-error --get \
            "$SUPABASE_URL/rest/v1/youtube_factory_jobs" "${auth[@]}" \
            --data-urlencode 'select=id' \
            --data-urlencode 'limit=1' > /tmp/result.json
          python -m json.tool /tmp/result.json >/dev/null
          echo 'Migrated Supabase credential is valid.'
