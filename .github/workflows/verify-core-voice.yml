name: Verify Core and Voice

on:
  push:
    paths:
      - '.github/workflows/verify-core-voice.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      MEDIAFORGE_CORE_KEY_B64: ${{ secrets.MEDIAFORGE_CORE_KEY_B64 }}
      MEDIAFORGE_VOICE_REFERENCE_B64: ${{ secrets.MEDIAFORGE_VOICE_REFERENCE_B64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate core key
        run: |
          set -euo pipefail
          test -n "$MEDIAFORGE_CORE_KEY_B64"
          python -m pip install -q cryptography
          cat encrypted-core/v7/part-01a.b64 encrypted-core/v7/part-01b.b64 encrypted-core/v7/part-02.b64 encrypted-core/v7/part-03.b64 encrypted-core/v7/part-04.b64 | tr -d '\r\n\t ' | base64 --decode >/tmp/core.bundle.enc
          PYTHONPATH=public-worker-template python - <<'PY'
          import io, pathlib, tarfile
          from worker import load_key, decrypt_bundle
          data = decrypt_bundle(pathlib.Path('/tmp/core.bundle.enc'), load_key())
          with tarfile.open(fileobj=io.BytesIO(data), mode='r:gz') as archive:
              names = archive.getnames()
          if 'run.py' not in names:
              raise SystemExit('run.py missing')
          print('Core key valid.')
          PY
      - name: Validate voice reference
        run: |
          set -euo pipefail
          test -n "$MEDIAFORGE_VOICE_REFERENCE_B64"
          printf '%s' "$MEDIAFORGE_VOICE_REFERENCE_B64" | base64 --decode >/tmp/voice.ogg
          test -s /tmp/voice.ogg
          if command -v ffmpeg >/dev/null 2>&1; then ffmpeg -v error -i /tmp/voice.ogg -f null -; else test -s /tmp/voice.ogg; fi
          echo 'Voice reference valid.'
