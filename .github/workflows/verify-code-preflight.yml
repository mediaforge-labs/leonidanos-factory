name: Verify Code Preflight

on:
  push:
    paths:
      - '.github/workflows/verify-code-preflight.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile prepare render finalize entrypoints
        run: |
          set -euo pipefail
          python -m py_compile youtube-worker/youtube_voice_common.py youtube-worker/english_validation_prepare.py youtube-worker/mediaforge_prepare_jobs.py public-worker-template/worker.py public-worker-template/supabase_chunked.py public-worker-template/factory_worker.py youtube-worker/mediaforge_upload_orchestrator.py youtube-worker/youtube_hosted_common.py youtube-worker/youtube_thumbnail_variant.py youtube-worker/youtube_private_uploader_hosted.py youtube-worker/youtube_shorts_uploader_hosted.py
          echo 'All factory entrypoints compile.'
