name: Migrate encrypted core into Leonidanos Factory

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/migrate-core.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Copy encrypted core v7 from legacy repository
        run: |
          set -euo pipefail
          mkdir -p encrypted-core/v7
          BASE='https://raw.githubusercontent.com/mediaforge-labs/media-pipeline-engine/main/encrypted-core/v7'
          for part in part-01a.b64 part-01b.b64 part-02.b64 part-03.b64 part-04.b64; do
            curl --fail --silent --show-error --location "$BASE/$part" -o "encrypted-core/v7/$part"
            test -s "encrypted-core/v7/$part"
          done
          test "$(cat encrypted-core/v7/*.b64 | tr -d '\r\n\t ' | base64 --decode | wc -c)" -eq 21279
      - name: Commit migrated core
        run: |
          set -euo pipefail
          git config user.name 'mediaforge-labs'
          git config user.email 'leonidanosportal@gmail.com'
          git add encrypted-core/v7
          if git diff --cached --quiet; then
            echo 'Encrypted core already migrated.'
            exit 0
          fi
          git commit -m 'Migrate encrypted production core into leonidanos-factory'
          git push origin HEAD:main
