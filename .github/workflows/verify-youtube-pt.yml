name: Verify YouTube PT

on:
  push:
    paths:
      - '.github/workflows/verify-youtube-pt.yml'
  workflow_dispatch:

jobs:
  verify-youtube-pt:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_PT_CLIENT_ID: ${{ secrets.YOUTUBE_PT_CLIENT_ID }}
      YOUTUBE_PT_CLIENT_SECRET: ${{ secrets.YOUTUBE_PT_CLIENT_SECRET }}
      YOUTUBE_PT_REFRESH_TOKEN: ${{ secrets.YOUTUBE_PT_REFRESH_TOKEN }}
      YOUTUBE_PT_CHANNEL_ID: ${{ secrets.YOUTUBE_PT_CHANNEL_ID }}
    steps:
      - name: Verify required secrets are present
        shell: bash
        run: |
          set -euo pipefail
          for name in YOUTUBE_PT_CLIENT_ID YOUTUBE_PT_CLIENT_SECRET YOUTUBE_PT_REFRESH_TOKEN YOUTUBE_PT_CHANNEL_ID; do
            if [ -z "${!name:-}" ]; then
              echo "Missing required secret: $name"
              exit 1
            fi
          done
          echo "All PT YouTube secrets are present."

      - name: Validate OAuth refresh token and channel binding
        shell: bash
        run: |
          set -euo pipefail

          TOKEN_JSON=$(curl -sS --fail-with-body \
            -X POST 'https://oauth2.googleapis.com/token' \
            --data-urlencode "client_id=${YOUTUBE_PT_CLIENT_ID}" \
            --data-urlencode "client_secret=${YOUTUBE_PT_CLIENT_SECRET}" \
            --data-urlencode "refresh_token=${YOUTUBE_PT_REFRESH_TOKEN}" \
            --data-urlencode 'grant_type=refresh_token')

          ACCESS_TOKEN=$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("access_token", ""))' <<<"$TOKEN_JSON")
          if [ -z "$ACCESS_TOKEN" ]; then
            echo "OAuth refresh failed: access token was not returned."
            exit 1
          fi

          CHANNEL_JSON=$(curl -sS --fail-with-body \
            -H "Authorization: Bearer ${ACCESS_TOKEN}" \
            'https://www.googleapis.com/youtube/v3/channels?part=id&mine=true')

          AUTH_CHANNEL_ID=$(python3 -c 'import json,sys; d=json.load(sys.stdin); items=d.get("items") or []; print(items[0].get("id", "") if items else "")' <<<"$CHANNEL_JSON")
          if [ -z "$AUTH_CHANNEL_ID" ]; then
            echo "YouTube OAuth succeeded, but no authenticated channel was returned."
            exit 1
          fi

          if [ "$AUTH_CHANNEL_ID" != "$YOUTUBE_PT_CHANNEL_ID" ]; then
            echo "YouTube PT channel mismatch: OAuth account does not match YOUTUBE_PT_CHANNEL_ID."
            exit 1
          fi

          echo "YouTube PT validation passed: refresh token works and channel binding is correct."
