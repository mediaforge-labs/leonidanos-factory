name: Verify YouTube EN

on:
  push:
    paths:
      - '.github/workflows/verify-youtube-en.yml'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      YOUTUBE_EN_CLIENT_ID: ${{ secrets.YOUTUBE_EN_CLIENT_ID }}
      YOUTUBE_EN_CLIENT_SECRET: ${{ secrets.YOUTUBE_EN_CLIENT_SECRET }}
      YOUTUBE_EN_REFRESH_TOKEN: ${{ secrets.YOUTUBE_EN_REFRESH_TOKEN }}
      YOUTUBE_EN_CHANNEL_ID: ${{ secrets.YOUTUBE_EN_CHANNEL_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Validate EN YouTube OAuth and channel
        run: |
          python -m pip install -q google-api-python-client google-auth requests
          PYTHONPATH=youtube-worker python - <<'PY'
          from youtube_hosted_common import youtube_client, assert_channel
          youtube = youtube_client('en-US')
          assert_channel(youtube, 'en-US')
          print('YouTube EN validation passed.')
          PY
